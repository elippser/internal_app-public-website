<svg xmlns="http://www.w3.org/2000/svg" viewBox="673 215 630 627" width="32" height="32">
  <!--
    Favicon de bookfer: el isotipo (la "b" con su punto), fondo transparente.

    La "b" usa currentColor y el punto un fill de circle: tinta + musgo sobre
    pestania clara, papel + pistacho (#c8e293, el verde claro del logo del
    footer) sobre pestania oscura, via el media query de abajo, que Chrome,
    Edge y Firefox aplican dentro de favicons SVG.

    OJO: nada de doble guion en este comentario (ni nombres de tokens CSS con
    su prefijo): un "menos menos" literal es ilegal en comentarios XML, rompe
    el parseo del archivo entero y el favicon desaparece sin error visible.
    Ese fue el bug que tuvo este archivo en produccion.

    Trazados: src/components/site/logoPaths.ts.
  -->
  <style>
    svg { color: #14150f; }
    circle { fill: #4d6a28; }
    @media (prefers-color-scheme: dark) {
      svg { color: #f2efe8; }
      circle { fill: #c8e293; }
    }
  </style>
