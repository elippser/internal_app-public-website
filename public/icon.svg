  <!--
    Favicon de roombir: el isotipo (las cuatro formas), fondo transparente.

    Las tres formas oscuras usan currentColor y la cuarta es un circle con
    fill propio: tinta + musgo sobre pestania clara, papel + pistacho
    (#c8e293) sobre pestania oscura, via el media query de abajo, que Chrome,
    Edge y Firefox aplican dentro de favicons SVG.

    OJO: nada de doble guion en este comentario (ni nombres de tokens CSS con
    su prefijo): un "menos menos" literal es ilegal en comentarios XML, rompe
    el parseo del archivo entero y el favicon desaparece sin error visible.
    Ese fue el bug que tuvo este archivo en produccion.

    Trazados: src/components/site/logoPaths.ts. No editar a mano.
  -->
